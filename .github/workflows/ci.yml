name: CI

on:
  push:
    branches:
      - feature/project-structure

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Compile Python source
        run: |
          python -m compileall -q src

      - name: Build Python wheel
        run: |
          python -m build --wheel

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import glob
          import sys
          import zipfile

          source_root = Path("src")

          wheels = glob.glob("dist/*.whl")

          if len(wheels) != 1:
              print(f"Expected exactly one wheel, found: {wheels}")
              sys.exit(1)

          wheel = wheels[0]

          print(f"Checking wheel: {wheel}")

          with zipfile.ZipFile(wheel) as archive:
              wheel_files = set(archive.namelist())

          source_files = {
              str(path.relative_to(source_root)).replace("\\", "/")
              for path in source_root.rglob("*.py")
          }

          missing = sorted(
              file
              for file in source_files
              if file not in wheel_files
          )

          if missing:
              print("\nPython files missing from wheel:\n")

              for file in missing:
                  print(f"  {file}")

              sys.exit(1)

          print(
              f"Verified {len(source_files)} Python files "
              "are included in the wheel."
          )
          PY

      - name: Install wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Verify installed package
        run: |
          python - <<'PY'
          import importlib.metadata

          distribution = importlib.metadata.distribution(
              "gridflow-analytics"
          )

          print(f"Package: {distribution.metadata['Name']}")
          print(f"Version: {distribution.version}")
          print("Wheel installation successful.")
          PY

      - name: Show wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]

          print(f"Wheel: {wheel}")
          print("\nPython files in wheel:\n")

          with zipfile.ZipFile(wheel) as archive:
              for file in sorted(archive.namelist()):
                  if file.endswith(".py"):
                      print(file)
          PY