name: CD

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Python wheel
        run: python -m build --wheel

      - name: Verify wheel exists
        run: ls -lh dist/

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@v0.9.0

      - name: Upload wheel to Databricks Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks fs cp dist/gridflow_analytics-0.1.0-py3-none-any.whl dbfs:/Volumes/gridflow_analytics_dev/default/packages/gridflow_analytics-0.1.0-py3-none-any.whl --overwrite

      - name: Verify wheel in Databricks Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks fs ls dbfs:/Volumes/gridflow_analytics_dev/default/packages