[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridflow-analytics"
version = "0.1.0"
description = "Electricity Analytics Platform built using Azure, Databricks and Spark."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Srijan" }
]

dependencies = [
    "pyspark>=3.5.0",
    "python-dotenv"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]